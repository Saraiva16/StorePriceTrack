name: CI/CD - Store Price Track

on:
  push:
    branches:
      - master

jobs:
  test-backend:
    name: Build & Test Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Testar Backend
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean test

  test-frontend:
    name: Build & Test Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar Dependências e Validar Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend] # A mágica acontece aqui: Só faz deploy se os testes passarem!
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Build das Imagens Docker
        run: |
          docker compose build
          docker save -o app-images.tar storepricetrack-backend:latest storepricetrack-frontend:latest
          gzip app-images.tar

      - name: Preparar docker-compose para AWS
        run: |
          grep -v "build: ./" docker-compose.yml > docker-compose.prod.yml

      - name: Enviar Imagens e Configuração para AWS
        run: |
          # Criar o diretório lá caso não exista
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@54.233.118.144 "mkdir -p /home/ubuntu/storePriceTrack/backend"
          
          # Enviar a imagem tar
          scp -v -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa app-images.tar.gz ubuntu@54.233.118.144:/home/ubuntu/storePriceTrack/
          
          # Enviar o docker-compose filtrado e o .env
          scp -v -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml ubuntu@54.233.118.144:/home/ubuntu/storePriceTrack/docker-compose.yml

      - name: Load das Imagens e Start
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@54.233.118.144 << 'EOF'
            cd /home/ubuntu/storePriceTrack
            gunzip -f app-images.tar.gz
            sudo docker load -i app-images.tar
            rm app-images.tar
            
            # Aqui não usamos --build, pois as imagens já estão carregadas
            sudo docker compose --env-file backend/.env up -d
          EOF
