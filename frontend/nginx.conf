server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Aumentar limite de upload para não barrar as fotos (padrão é 1MB)
    client_max_body_size 20M;

    # Proxy Reverso: Envia tudo que começar com /api para o Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos estáticos imutáveis gerados pelo Vite (possuem hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Arquivo de checagem de versão: NUNCA armazenar em cache
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Manifest e favicons: revalidação rápida
    location ~* \.(json|svg|ico)$ {
        add_header Cache-Control "no-cache";
    }

    # index.html explícito: NUNCA armazenar em cache
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Rota raiz e fallback SPA: NUNCA armazenar em cache o index.html entregue
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }
}
