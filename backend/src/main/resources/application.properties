spring.application.name=store-price-track
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/store_price_track}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

spring.data.web.pageable.max-page-size=100

spring.cache.type=simple
spring.cache.cache-names=categories,products,priceStats,topProducts,priceTrend,marketComparison,cheapestProducts,mostExpensiveProducts,bestShoppingDays,purchasePattern

google.ai.base-url=https://generativelanguage.googleapis.com
google.ai.api-key=${GOOGLE_AI_API_KEY:}
google.ai.model=${GOOGLE_AI_MODEL:gemini-3.8-flash}


