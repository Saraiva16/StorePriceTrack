# Sobrescreve as configurações do application.properties para o perfil "prod"

# Desativa a criação/alteração automática de tabelas pelo Hibernate
# Em produção, apenas o Flyway ou scripts SQL têm permissão de alterar a estrutura do banco (Idealmente)
# Porém, estamos usando update para não crashar sem os scripts do flyway.
spring.jpa.hibernate.ddl-auto=update

# Configurações do Flyway mantidas
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
